[package]
name = "citymap-cli"
description = "citymap: a repository in, a city (JSON, SVG) and a lockfile out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "citymap"
path = "src/main.rs"

[dependencies]
citymap-ground-plan.workspace = true
citymap-history.workspace = true
citymap-measures.workspace = true
citymap-svg.workspace = true
citymap-themes.workspace = true
mimalloc = { workspace = true, optional = true }

[features]
# mimalloc as the global allocator: faster folds, at the cost of compiling its C sources. Off by default.
mimalloc = ["dep:mimalloc"]

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
